[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snapper-delegate"
version = "0.1.0"
description = "Dependency-light consult delegate for Snapper"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Mateusz Klatt", email = "mateusz@klatt.ie"}]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/mateusz-klatt/snapper-delegate"
Repository = "https://github.com/mateusz-klatt/snapper-delegate"
Issues = "https://github.com/mateusz-klatt/snapper-delegate/issues"

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-timeout==2.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
addopts = "-q --tb=short --timeout=15"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
